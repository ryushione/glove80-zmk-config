# Enable ZMK Studio for live keymap editing over USB-serial.
# See https://zmk.dev/docs/features/studio
# Companion change: snippets = [ "studio-rpc-usb-uart" ] on the left half
# in config/default.nix.  Once Studio is enabled, .keymap source edits are
# ignored until "Restore Stock Settings" in Studio.
CONFIG_ZMK_STUDIO=y
