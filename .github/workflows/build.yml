name: Build

# Delegates to ZMK's official reusable workflow. It reads build.yaml,
# resolves west.yml (which pulls moergo-sc/zmk for Glove80 board files),
# compiles one UF2 per matrix entry, uploads them as artifacts.
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
